<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hit-and-blow</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>html,body,#root{margin:0;min-height:100%;}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;}</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useEffect, useMemo, useRef } = React;

const COLORS = [
  { id: 0, name: "赤", bg: "#dc2626", light: "#fca5a5", shadow: "#991b1b", glow: "rgba(220,38,38,0.25)" },
  { id: 1, name: "青", bg: "#2563eb", light: "#93c5fd", shadow: "#1e3a8a", glow: "rgba(37,99,235,0.25)" },
  { id: 2, name: "緑", bg: "#16a34a", light: "#86efac", shadow: "#14532d", glow: "rgba(22,163,74,0.25)" },
  { id: 3, name: "黄", bg: "#ca8a04", light: "#fde68a", shadow: "#854d0e", glow: "rgba(202,138,4,0.25)" },
  { id: 4, name: "紫", bg: "#7c3aed", light: "#c4b5fd", shadow: "#4c1d95", glow: "rgba(124,58,237,0.25)" },
  { id: 5, name: "橙", bg: "#ea580c", light: "#fdba74", shadow: "#9a3412", glow: "rgba(234,88,12,0.25)" },
];
const MAX_TURNS = 10, CODE_LEN = 4;

function generateSecret() {
  const arr = [];
  while (arr.length < CODE_LEN) { const r = Math.floor(Math.random() * COLORS.length); if (!arr.includes(r)) arr.push(r); }
  return arr;
}
function judge(secret, guess) {
  let hit = 0; const sR = [], gR = [];
  for (let i = 0; i < CODE_LEN; i++) { if (guess[i] === secret[i]) hit++; else { sR.push(secret[i]); gR.push(guess[i]); } }
  let blow = 0; for (const g of gR) { const idx = sR.indexOf(g); if (idx !== -1) { blow++; sR.splice(idx, 1); } }
  return { hit, blow };
}
function Pawn({ color, size = 40, glow = false, dim = false }) {
  const c = COLORS[color]; if (c == null) return null;
  return (<svg width={size} height={size} viewBox="0 0 40 40" style={{ filter: glow ? `drop-shadow(0 2px 6px ${c.glow})` : dim ? "brightness(0.7) saturate(0.2) opacity(0.4)" : "none", transition: "all 0.3s ease" }}>
    <ellipse cx="20" cy="35" rx="13" ry="4" fill={c.shadow} />
    <path d="M12 35 Q10 28 14 22 L16 18 Q14 16 14 13 Q14 8 20 6 Q26 8 26 13 Q26 16 24 18 L26 22 Q30 28 28 35 Z" fill={c.bg} stroke={c.shadow} strokeWidth="0.8" />
    <path d="M16 34 Q15 28 17 23 L18.5 19 Q17 17 17 14 Q17 10 20 8.5 Q21 10 21 13 Q21 15 19.5 17 L18 21 Q16 26 17 34 Z" fill={c.light} opacity="0.5" />
    <circle cx="18.5" cy="11.5" r="2" fill="#fff" opacity="0.4" />
  </svg>);
}
function EmptySlot({ size = 40, active = false }) {
  return (<div style={{ width: size, height: size, borderRadius: "10px", border: active ? "2px dashed #94a3b8" : "2px dashed #d1d5db", display: "flex", alignItems: "center", justifyContent: "center", background: active ? "#f8fafc" : "transparent", transition: "all 0.2s" }}>
    <span style={{ fontSize: "1.1rem", color: "#cbd5e1" }}>♟</span>
  </div>);
}

function HitAndBlow() {
  const [secret, setSecret] = useState(() => generateSecret());
  const [guesses, setGuesses] = useState([]);
  const [current, setCurrent] = useState([null, null, null, null]);
  const [activeSlot, setActiveSlot] = useState(0);
  const [gameState, setGameState] = useState("playing");
  const [shake, setShake] = useState(false);
  const [showRules, setShowRules] = useState(false);
  const listRef = useRef();

  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [guesses.length]);
  const placeColor = useCallback((colorId) => { if (gameState !== "playing") return; setCurrent(prev => { const n = [...prev]; n[activeSlot] = colorId; return n; }); if (activeSlot < 3) setActiveSlot(activeSlot + 1); }, [activeSlot, gameState]);
  const clearSlot = useCallback((idx) => { if (gameState !== "playing") return; setCurrent(prev => { const n = [...prev]; n[idx] = null; return n; }); setActiveSlot(idx); }, [gameState]);
  const submitGuess = useCallback(() => {
    if (gameState !== "playing") return;
    if (current.some(c => c === null)) { setShake(true); setTimeout(() => setShake(false), 500); return; }
    if (new Set(current).size !== CODE_LEN) { setShake(true); setTimeout(() => setShake(false), 500); return; }
    const result = judge(secret, current);
    const newGuesses = [...guesses, { colors: [...current], ...result }];
    setGuesses(newGuesses); setCurrent([null, null, null, null]); setActiveSlot(0);
    if (result.hit === 4) setGameState("won");
    else if (newGuesses.length >= MAX_TURNS) setGameState("lost");
  }, [current, secret, guesses, gameState]);
  const resetGame = () => { setSecret(generateSecret()); setGuesses([]); setCurrent([null, null, null, null]); setActiveSlot(0); setGameState("playing"); setShake(false); };
  const isFilled = current.every(c => c !== null);

  return (
    <div style={{ minHeight: "100vh", background: "#ffffff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", fontFamily: "'Nunito', 'Hiragino Sans', sans-serif", color: "#1e293b", padding: "24px 16px", userSelect: "none" }}>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet" />

      {showRules && (
        <div style={{ position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.35)",backdropFilter:"blur(6px)",display:"flex",alignItems:"center",justifyContent:"center",animation:"fadeIn 0.3s ease" }} onClick={()=>setShowRules(false)}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#fff",borderRadius:"20px",padding:"28px 32px",maxWidth:"400px",width:"90%",border:"1px solid #e2e8f0",boxShadow:"0 20px 60px rgba(0,0,0,0.12)",animation:"modalIn 0.4s ease" }}>
            <h2 style={{ fontSize:"1.1rem",fontWeight:900,color:"#1e293b",margin:"0 0 12px" }}>📖 Hit & Blow のルール</h2>
            <div style={{ fontSize:"0.82rem",color:"#475569",lineHeight:1.9 }}>
              <p style={{margin:"0 0 8px"}}>6色のポーンから<b>重複なしで4つ</b>選ばれた秘密の組み合わせを、<b>10回以内</b>に当てるゲームです。</p>
              <p style={{margin:"0 0 8px"}}>🟢 <b>Hit</b> = 色も位置も正解</p>
              <p style={{margin:"0 0 8px"}}>🟡 <b>Blow</b> = 色は合っているが位置が違う</p>
              <p style={{margin:0,color:"#94a3b8",fontSize:"0.75rem"}}>💡 HitとBlowの数を手がかりに絞り込みましょう。</p>
            </div>
            <button onClick={()=>setShowRules(false)} style={{ marginTop:"16px",width:"100%",padding:"10px",background:"#1e293b",color:"#fff",border:"none",borderRadius:"10px",fontWeight:700,fontSize:"0.85rem",cursor:"pointer" }}>閉じる</button>
          </div>
        </div>
      )}

      <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"2px" }}>
        <h1 style={{ fontFamily:"'Fredoka One',cursive", fontSize:"1.8rem", letterSpacing:"0.08em", margin:0, color:"#1e293b" }}>♟ Hit & Blow ♟</h1>
        <button onClick={()=>setShowRules(true)} style={{ width:"28px",height:"28px",borderRadius:"50%",border:"1.5px solid #d1d5db",background:"#f8fafc",color:"#64748b",fontSize:"0.8rem",fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>?</button>
      </div>
      <div style={{ fontSize:"0.72rem", color:"#64748b", letterSpacing:"0.12em", marginBottom:"14px" }}>6色から4つ選んで暗号を解読せよ</div>

      <div style={{ display:"flex", gap:"4px", marginBottom:"14px" }}>
        {Array.from({ length: MAX_TURNS }).map((_, i) => (
          <div key={i} style={{ width:"20px", height:"5px", borderRadius:"3px", background: i < guesses.length ? (gameState === "won" && i === guesses.length - 1 ? "#16a34a" : "#64748b") : "#e2e8f0", transition:"all 0.3s" }} />
        ))}
      </div>

      <div style={{ background:"#f8fafc", borderRadius:"20px", padding:"20px", width:"100%", maxWidth:"420px", border:"1px solid #e2e8f0", boxShadow:"0 4px 24px rgba(0,0,0,0.06)" }}>
        <div ref={listRef} style={{ maxHeight:"340px", overflowY:"auto", marginBottom:"16px", paddingRight:"4px", minHeight: guesses.length === 0 ? "60px" : "auto" }}>
          {guesses.length === 0 && gameState === "playing" && (<div style={{ textAlign:"center", padding:"16px 0", color:"#94a3b8", fontSize:"0.8rem" }}>下のパレットからポーンを選ぼう</div>)}
          {guesses.map((g, i) => {
            const isLast = i === guesses.length - 1;
            return (
              <div key={i} style={{ display:"flex", alignItems:"center", gap:"8px", padding:"8px 10px", borderRadius:"12px", background: g.hit === 4 ? "#f0fdf4" : "#ffffff", marginBottom:"6px", border: g.hit === 4 ? "1.5px solid #86efac" : "1px solid #e2e8f0", animation: isLast ? "rowIn 0.35s ease" : "none" }}>
                <div style={{ width:"24px", flexShrink:0, fontSize:"0.7rem", fontWeight:800, color:"#94a3b8" }}>{i + 1}</div>
                <div style={{ display:"flex", gap:"6px", flex:1 }}>
                  {g.colors.map((c, j) => {
                    const isHit = gameState !== "playing" && secret[j] === c;
                    const isBlow = gameState !== "playing" && secret[j] !== c && secret.includes(c);
                    const isMiss = gameState !== "playing" && !isHit && !isBlow;
                    return (<div key={j} style={{ width:"44px", height:"44px", display:"flex", alignItems:"center", justifyContent:"center", borderRadius:"10px", background: isHit ? "#dcfce7" : isBlow ? "#fef9c3" : "#f1f5f9", border: isHit ? "2px solid #4ade80" : isBlow ? "2px solid #facc15" : "1px solid #e2e8f0", transition:"all 0.4s" }}><Pawn color={c} size={36} dim={isMiss} /></div>);
                  })}
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px", width:"44px", flexShrink:0 }}>
                  {Array.from({ length: CODE_LEN }).map((_, k) => {
                    const isH = k < g.hit, isB = k >= g.hit && k < g.hit + g.blow;
                    return (<div key={k} style={{ width:"17px", height:"17px", borderRadius:"50%", background: isH ? "#16a34a" : isB ? "#ca8a04" : "#e2e8f0", border: isH ? "2px solid #15803d" : isB ? "2px solid #a16207" : "2px solid #cbd5e1", boxShadow: isH ? "0 1px 4px rgba(22,163,74,0.3)" : isB ? "0 1px 4px rgba(202,138,4,0.3)" : "none", transition:"all 0.3s" }} />);
                  })}
                </div>
              </div>
            );
          })}
        </div>

        {gameState === "playing" ? (<>
          <div style={{ display:"flex", gap:"8px", justifyContent:"center", marginBottom:"14px", padding:"12px", borderRadius:"14px", background:"#ffffff", border:"1px solid #e2e8f0", boxShadow:"0 2px 8px rgba(0,0,0,0.04)", animation: shake ? "shakeAnim 0.4s ease" : "none" }}>
            {current.map((c, i) => (
              <div key={i} onClick={() => { setActiveSlot(i); if (c !== null) clearSlot(i); }} style={{ width:"56px", height:"56px", borderRadius:"12px", display:"flex", alignItems:"center", justifyContent:"center", background: activeSlot === i ? "#f0f9ff" : "#f8fafc", border: activeSlot === i ? "2.5px solid #3b82f6" : "2px solid #d1d5db", cursor:"pointer", transition:"all 0.2s", boxShadow: activeSlot === i ? "0 0 0 3px rgba(59,130,246,0.15)" : "none" }}>
                {c !== null ? <Pawn color={c} size={42} glow={activeSlot === i} /> : <EmptySlot size={40} active={activeSlot === i} />}
              </div>
            ))}
          </div>
          <div style={{ display:"flex", gap:"6px", justifyContent:"center", marginBottom:"14px", flexWrap:"wrap" }}>
            {COLORS.map(c => { const used = current.includes(c.id); return (
              <button key={c.id} onClick={() => !used && placeColor(c.id)} style={{ width:"54px", height:"58px", borderRadius:"12px", border: used ? "2px solid #e2e8f0" : `2px solid ${c.bg}66`, background: used ? "#f1f5f9" : `${c.bg}0a`, cursor: used ? "not-allowed" : "pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s", opacity: used ? 0.3 : 1, padding:0 }}>
                <Pawn color={c.id} size={40} dim={used} />
              </button>); })}
          </div>
          <button onClick={submitGuess} style={{ width:"100%", padding:"13px", borderRadius:"12px", background: isFilled ? "#1e293b" : "#e2e8f0", color: isFilled ? "#fff" : "#94a3b8", border:"none", fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:"0.95rem", letterSpacing:"0.1em", cursor: isFilled ? "pointer" : "default", transition:"all 0.25s", boxShadow: isFilled ? "0 4px 12px rgba(30,41,59,0.2)" : "none" }}>回答する</button>
        </>) : (
          <div style={{ textAlign:"center" }}>
            <div style={{ padding:"16px", borderRadius:"14px", background: gameState === "won" ? "#f0fdf4" : "#fef2f2", border: gameState === "won" ? "1.5px solid #86efac" : "1.5px solid #fecaca", marginBottom:"14px" }}>
              <div style={{ fontSize:"0.8rem", letterSpacing:"0.15em", color: gameState === "won" ? "#15803d" : "#dc2626", marginBottom:"10px", fontWeight:800 }}>{gameState === "won" ? "暗号解読成功！" : "暗号解読失敗…"}</div>
              <div style={{ display:"flex", gap:"8px", justifyContent:"center", marginBottom:"10px" }}>
                {secret.map((c, i) => (<div key={i} style={{ width:"56px", height:"56px", display:"flex", alignItems:"center", justifyContent:"center", borderRadius:"12px", background: gameState === "won" ? "#dcfce7" : "#ffffff", border: gameState === "won" ? "2px solid #4ade80" : "2px solid #e2e8f0", animation:"popIn 0.4s ease both", animationDelay:`${i * 0.12}s` }}><Pawn color={c} size={42} glow /></div>))}
              </div>
              {gameState === "won" && (<div style={{ fontSize:"0.95rem", color:"#15803d", fontWeight:800 }}>{guesses.length <= 3 ? "天才的！" : guesses.length <= 5 ? "素晴らしい！" : guesses.length <= 7 ? "お見事！" : "ギリギリ！"}<span style={{ fontWeight:400, color:"#64748b" }}> {guesses.length}回</span></div>)}
              {gameState === "lost" && (<div style={{ fontSize:"0.9rem", color:"#dc2626", fontWeight:700 }}>次は頑張ろう！</div>)}
            </div>
            <button onClick={resetGame} style={{ width:"100%", padding:"13px", borderRadius:"12px", background:"#1e293b", color:"#fff", border:"none", fontFamily:"'Nunito',sans-serif", fontWeight:800, fontSize:"0.95rem", letterSpacing:"0.1em", cursor:"pointer", boxShadow:"0 4px 12px rgba(30,41,59,0.2)" }}>もう一局</button>
          </div>
        )}
      </div>

      <div style={{ display:"flex", gap:"20px", marginTop:"16px", fontSize:"0.78rem", color:"#475569", fontWeight:600 }}>
        <div style={{ display:"flex", alignItems:"center", gap:"6px" }}><div style={{ width:"14px", height:"14px", borderRadius:"50%", background:"#16a34a", border:"2px solid #15803d" }} />Hit（色も位置も正解）</div>
        <div style={{ display:"flex", alignItems:"center", gap:"6px" }}><div style={{ width:"14px", height:"14px", borderRadius:"50%", background:"#ca8a04", border:"2px solid #a16207" }} />Blow（色のみ正解）</div>
      </div>

      <style>{`
        @keyframes rowIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        div::-webkit-scrollbar { width: 4px; }
        div::-webkit-scrollbar-track { background: transparent; }
        div::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
      `}</style>
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(HitAndBlow));
  </script>
</body>
</html>
