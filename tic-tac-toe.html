<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tic-tac-toe</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>html,body,#root{margin:0;min-height:100%;}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;}</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useCallback, useEffect, useMemo, useRef } = React;

// --- AI (Minimax, unbeatable) ---
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];

function checkWinner(board) {
  for (const [a,b,c] of LINES) {
    if (board[a] && board[a] === board[b] && board[a] === board[c])
      return { winner: board[a], line: [a,b,c] };
  }
  return null;
}

function isFull(board) { return board.every(c => c !== null); }

function minimax(board, isMax, alpha, beta) {
  const result = checkWinner(board);
  if (result) return result.winner === "O" ? 10 : -10;
  if (isFull(board)) return 0;

  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = "O";
      best = Math.max(best, minimax(board, false, alpha, beta));
      board[i] = null;
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = "X";
      best = Math.min(best, minimax(board, true, alpha, beta));
      board[i] = null;
      beta = Math.min(beta, best);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function getBestMove(board, difficulty) {
  // Easy: random. Normal: 50% best. Hard: always best.
  if (difficulty === "easy") {
    const empty = board.map((v,i) => v === null ? i : -1).filter(i => i >= 0);
    return empty[Math.floor(Math.random() * empty.length)];
  }
  if (difficulty === "normal" && Math.random() < 0.4) {
    const empty = board.map((v,i) => v === null ? i : -1).filter(i => i >= 0);
    return empty[Math.floor(Math.random() * empty.length)];
  }
  let bestScore = -Infinity, bestIdx = -1;
  const b = [...board];
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = "O";
    const score = minimax(b, false, -Infinity, Infinity);
    b[i] = null;
    if (score > bestScore) { bestScore = score; bestIdx = i; }
  }
  return bestIdx;
}

// --- SVG Marks ---
function XMark({ size = 70, animate = false }) {
  return (
    <svg width={size} height={size} viewBox="0 0 70 70">
      <line x1="16" y1="16" x2="54" y2="54" stroke="#dc2626" strokeWidth="6" strokeLinecap="round"
        style={animate ? { strokeDasharray: 54, strokeDashoffset: 54, animation: "drawLine 0.35s ease forwards" } : {}} />
      <line x1="54" y1="16" x2="16" y2="54" stroke="#dc2626" strokeWidth="6" strokeLinecap="round"
        style={animate ? { strokeDasharray: 54, strokeDashoffset: 54, animation: "drawLine 0.35s ease 0.1s forwards" } : {}} />
    </svg>
  );
}

function OMark({ size = 70, animate = false }) {
  const r = 20, circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} viewBox="0 0 70 70">
      <circle cx="35" cy="35" r={r} fill="none" stroke="#2563eb" strokeWidth="6" strokeLinecap="round"
        style={animate ? { strokeDasharray: circ, strokeDashoffset: circ, animation: `drawCircle 0.4s ease forwards` } : {}} />
    </svg>
  );
}

function WinLine({ line, cellSize, gap }) {
  if (!line) return null;
  const getCenter = (idx) => {
    const row = Math.floor(idx / 3);
    const col = idx % 3;
    const x = col * (cellSize + gap) + cellSize / 2;
    const y = row * (cellSize + gap) + cellSize / 2;
    return { x, y };
  };
  const start = getCenter(line[0]);
  const end = getCenter(line[2]);
  const len = Math.sqrt((end.x - start.x) ** 2 + (end.y - start.y) ** 2);
  return (
    <svg style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", pointerEvents: "none", zIndex: 10 }}>
      <line x1={start.x} y1={start.y} x2={end.x} y2={end.y}
        stroke="#f59e0b" strokeWidth="5" strokeLinecap="round" opacity="0.85"
        style={{ strokeDasharray: len, strokeDashoffset: len, animation: "drawLine 0.5s ease 0.2s forwards" }} />
    </svg>
  );
}

// --- Component ---
const CELL_SIZE = 100;
const GAP = 8;

const DIFF_OPTIONS = [
  { key: "easy", label: "よわい" },
  { key: "normal", label: "ふつう" },
  { key: "hard", label: "最強" },
];

function TicTacToe() {
  const [board, setBoard] = useState(Array(9).fill(null));
  const [turn, setTurn] = useState("X"); // X = player
  const [result, setResult] = useState(null); // { winner, line } | "draw"
  const [difficulty, setDifficulty] = useState("normal");
  const [score, setScore] = useState({ player: 0, ai: 0, draw: 0 });
  const [thinking, setThinking] = useState(false);
  const [moveHistory, setMoveHistory] = useState([]);
  const [lastAiMove, setLastAiMove] = useState(null);
  const [showHelp, setShowHelp] = useState(false);

  // AI turn
  useEffect(() => {
    if (turn !== "O" || result) return;
    setThinking(true);
    const timer = setTimeout(() => {
      const idx = getBestMove(board, difficulty);
      if (idx === -1 || idx == null) return;
      const nb = [...board];
      nb[idx] = "O";
      setBoard(nb);
      setLastAiMove(idx);
      setMoveHistory(prev => [...prev, idx]);
      const w = checkWinner(nb);
      if (w) {
        setResult(w);
        setScore(s => ({ ...s, ai: s.ai + 1 }));
      } else if (isFull(nb)) {
        setResult("draw");
        setScore(s => ({ ...s, draw: s.draw + 1 }));
      } else {
        setTurn("X");
      }
      setThinking(false);
    }, 350);
    return () => clearTimeout(timer);
  }, [turn, board, result, difficulty]);

  const handleClick = useCallback((i) => {
    if (board[i] || turn !== "X" || result || thinking) return;
    const nb = [...board];
    nb[i] = "X";
    setBoard(nb);
    setLastAiMove(null);
    setMoveHistory(prev => [...prev, i]);
    const w = checkWinner(nb);
    if (w) {
      setResult(w);
      setScore(s => ({ ...s, player: s.player + 1 }));
    } else if (isFull(nb)) {
      setResult("draw");
      setScore(s => ({ ...s, draw: s.draw + 1 }));
    } else {
      setTurn("O");
    }
  }, [board, turn, result, thinking]);

  const resetGame = () => {
    setBoard(Array(9).fill(null));
    setTurn("X");
    setResult(null);
    setThinking(false);
    setMoveHistory([]);
    setLastAiMove(null);
  };

  const winLine = result && result !== "draw" ? result.line : null;
  const winnerLabel = result === "draw" ? null : result?.winner === "X" ? "player" : "ai";
  const gameOver = !!result;
  const totalGames = score.player + score.ai + score.draw;

  const HelpModal = () => {
    if (!showHelp) return null;
    return (
      <div style={{
        position: "fixed", inset: 0, zIndex: 200,
        background: "rgba(0,0,0,0.3)", backdropFilter: "blur(4px)",
        display: "flex", alignItems: "center", justifyContent: "center",
      }} onClick={() => setShowHelp(false)}>
        <div onClick={e => e.stopPropagation()} style={{
          background: "#ffffff", borderRadius: "18px",
          padding: "28px 32px", maxWidth: "380px", width: "90%",
          border: "1px solid #e2e8f0",
          boxShadow: "0 20px 60px rgba(0,0,0,0.12)",
        }}>
          <div style={{ fontSize: "1.1rem", fontWeight: 900, color: "#1e293b", marginBottom: "14px" }}>
            三目並べのルール
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            <div style={{ display: "flex", gap: "10px", fontSize: "0.8rem", color: "#475569", lineHeight: 1.6 }}>
              <span style={{ color: "#94a3b8", fontWeight: 700, flexShrink: 0 }}>1.</span>
              <span>3×3のマスに、あなた（✕）とAI（○）が交互に印を置きます。</span>
            </div>
            <div style={{ display: "flex", gap: "10px", fontSize: "0.8rem", color: "#475569", lineHeight: 1.6 }}>
              <span style={{ color: "#94a3b8", fontWeight: 700, flexShrink: 0 }}>2.</span>
              <span>縦・横・斜めのいずれか一列に先に3つ揃えた方が勝ちです。</span>
            </div>
            <div style={{ display: "flex", gap: "10px", fontSize: "0.8rem", color: "#475569", lineHeight: 1.6 }}>
              <span style={{ color: "#94a3b8", fontWeight: 700, flexShrink: 0 }}>3.</span>
              <span>全マス埋まっても揃わなければ引き分けです。</span>
            </div>
            <div style={{ display: "flex", gap: "10px", fontSize: "0.8rem", color: "#475569", lineHeight: 1.6 }}>
              <span style={{ color: "#94a3b8", fontWeight: 700, flexShrink: 0 }}>4.</span>
              <span>難易度「最強」のAIは絶対に負けません。引き分けを目指しましょう！</span>
            </div>
          </div>
          <button onClick={() => setShowHelp(false)} style={{
            marginTop: "18px", width: "100%", padding: "10px",
            background: "#f1f5f9", color: "#475569",
            border: "1px solid #e2e8f0", borderRadius: "10px",
            fontWeight: 700, fontSize: "0.85rem", cursor: "pointer",
          }}>閉じる</button>
        </div>
      </div>
    );
  };

  return (
    <div style={{
      minHeight: "100vh", background: "#ffffff",
      display: "flex", flexDirection: "column", alignItems: "center",
      justifyContent: "center",
      fontFamily: "'Nunito', 'Hiragino Sans', sans-serif",
      color: "#1e293b", padding: "24px 16px", userSelect: "none",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet" />

      <HelpModal />
      <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"2px" }}>
        <h1 style={{
          fontFamily: "'Fredoka One', cursive",
          fontSize: "2rem", letterSpacing: "0.06em", margin: 0,
          color: "#1e293b",
        }}>三目並べ</h1>
        <button onClick={() => setShowHelp(true)} style={{
          width: "32px", height: "32px", borderRadius: "50%",
          background: "#f1f5f9", color: "#64748b",
          border: "1.5px solid #e2e8f0",
          fontSize: "0.85rem", fontWeight: 800, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center",
          flexShrink: 0,
        }}>?</button>
      </div>

      <a href="./index.html" style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        padding: "6px 12px", marginBottom: "12px",
        borderRadius: "999px", border: "1.5px solid #cbd5e1",
        background: "#ffffff", color: "#334155",
        textDecoration: "none", fontSize: "0.72rem", fontWeight: 800,
        letterSpacing: "0.04em",
      }}>← ゲーム一覧へ</a>
      <div style={{
        fontSize: "0.72rem", color: "#94a3b8",
        letterSpacing: "0.12em", marginBottom: "16px",
      }}>Tic-Tac-Toe</div>

      {/* Scoreboard */}
      <div style={{
        display: "flex", gap: "6px", alignItems: "stretch",
        marginBottom: "16px",
        background: "#f8fafc",
        borderRadius: "14px",
        border: "1px solid #e2e8f0",
        padding: "4px",
        boxShadow: "0 1px 4px rgba(0,0,0,0.04)",
      }}>
        <div style={{
          padding: "8px 18px", borderRadius: "10px", textAlign: "center",
          background: !gameOver && turn === "X" ? "#fef2f2" : "transparent",
          border: !gameOver && turn === "X" ? "1.5px solid #fecaca" : "1.5px solid transparent",
          transition: "all 0.3s", minWidth: "72px",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "5px" }}>
            <XMark size={18} />
            <span style={{ fontSize: "0.7rem", color: "#94a3b8", fontWeight: 600 }}>あなた</span>
          </div>
          <div style={{ fontSize: "1.4rem", fontWeight: 900, color: "#dc2626", lineHeight: 1.1 }}>{score.player}</div>
        </div>
        <div style={{
          padding: "8px 14px", borderRadius: "10px", textAlign: "center",
          minWidth: "56px",
        }}>
          <div style={{ fontSize: "0.65rem", color: "#cbd5e1", fontWeight: 600 }}>引分</div>
          <div style={{ fontSize: "1.4rem", fontWeight: 900, color: "#94a3b8", lineHeight: 1.1 }}>{score.draw}</div>
        </div>
        <div style={{
          padding: "8px 18px", borderRadius: "10px", textAlign: "center",
          background: !gameOver && turn === "O" ? "#eff6ff" : "transparent",
          border: !gameOver && turn === "O" ? "1.5px solid #bfdbfe" : "1.5px solid transparent",
          transition: "all 0.3s", minWidth: "72px",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "5px" }}>
            <OMark size={18} />
            <span style={{ fontSize: "0.7rem", color: "#94a3b8", fontWeight: 600 }}>AI</span>
          </div>
          <div style={{ fontSize: "1.4rem", fontWeight: 900, color: "#2563eb", lineHeight: 1.1 }}>{score.ai}</div>
        </div>
      </div>

      {/* Status message */}
      <div style={{
        marginBottom: "14px", fontSize: "0.85rem", fontWeight: 700,
        minHeight: "1.4em",
        color: gameOver
          ? (result === "draw" ? "#a16207" : winnerLabel === "player" ? "#15803d" : "#dc2626")
          : thinking ? "#2563eb" : "#64748b",
        transition: "color 0.3s",
      }}>
        {thinking && <span style={{ display: "inline-block", animation: "pulse 1.2s ease-in-out infinite", marginRight: 4 }}>●</span>}
        {gameOver
          ? (result === "draw" ? "引き分け！" : winnerLabel === "player" ? "あなたの勝ち！" : "AIの勝ち！")
          : thinking ? "AI思考中..." : "あなたの番です（✕）"
        }
      </div>

      {/* Board */}
      <div style={{
        position: "relative",
        width: CELL_SIZE * 3 + GAP * 2,
        height: CELL_SIZE * 3 + GAP * 2,
      }}>
        <WinLine line={winLine} cellSize={CELL_SIZE} gap={GAP} />
        <div style={{
          display: "grid",
          gridTemplateColumns: `repeat(3, ${CELL_SIZE}px)`,
          gridTemplateRows: `repeat(3, ${CELL_SIZE}px)`,
          gap: `${GAP}px`,
        }}>
          {board.map((cell, i) => {
            const row = Math.floor(i / 3);
            const col = i % 3;
            const isNew = moveHistory[moveHistory.length - 1] === i;
            const clickable = !cell && turn === "X" && !result && !thinking;
            return (
              <div key={i}
                onClick={() => handleClick(i)}
                style={{
                  width: CELL_SIZE, height: CELL_SIZE,
                  borderRadius: "16px",
                  background: cell ? "#f8fafc" : clickable ? "#ffffff" : "#fafafa",
                  border: winLine && winLine.includes(i)
                    ? "2.5px solid #f59e0b"
                    : cell ? "1.5px solid #e2e8f0"
                    : clickable ? "2px solid #d1d5db" : "1.5px solid #e2e8f0",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  cursor: clickable ? "pointer" : "default",
                  transition: "all 0.15s",
                  boxShadow: clickable ? "0 2px 8px rgba(0,0,0,0.04)" : winLine && winLine.includes(i) ? "0 0 12px rgba(245,158,11,0.15)" : "none",
                }}
                onMouseEnter={e => { if (clickable) { e.currentTarget.style.background = "#f0f9ff"; e.currentTarget.style.borderColor = "#93c5fd"; } }}
                onMouseLeave={e => { if (clickable) { e.currentTarget.style.background = "#ffffff"; e.currentTarget.style.borderColor = "#d1d5db"; } }}
              >
                {cell === "X" && <XMark size={56} animate={isNew} />}
                {cell === "O" && <OMark size={56} animate={isNew} />}
              </div>
            );
          })}
        </div>
      </div>

      {/* Controls */}
      <div style={{
        display: "flex", gap: "10px", marginTop: "20px", alignItems: "center",
        flexWrap: "wrap", justifyContent: "center",
      }}>
        <label style={{ fontSize: "0.75rem", color: "#64748b", display: "flex", alignItems: "center", gap: "8px", fontWeight: 600 }}>
          難易度
          <div style={{ display: "flex", gap: "4px" }}>
            {DIFF_OPTIONS.map(d => (
              <button key={d.key}
                onClick={() => { setDifficulty(d.key); resetGame(); }}
                style={{
                  padding: "5px 12px",
                  borderRadius: "8px",
                  border: difficulty === d.key ? "1.5px solid #1e293b" : "1.5px solid #e2e8f0",
                  background: difficulty === d.key ? "#1e293b" : "#ffffff",
                  color: difficulty === d.key ? "#ffffff" : "#64748b",
                  fontSize: "0.75rem",
                  fontWeight: 700,
                  cursor: "pointer",
                  transition: "all 0.15s",
                }}
              >{d.label}</button>
            ))}
          </div>
        </label>
      </div>

      {gameOver && (
        <button onClick={resetGame} style={{
          marginTop: "16px",
          padding: "10px 36px",
          background: "#1e293b", color: "#ffffff",
          border: "none", borderRadius: "12px",
          fontFamily: "'Nunito', sans-serif",
          fontWeight: 800, fontSize: "0.95rem",
          cursor: "pointer",
          boxShadow: "0 4px 12px rgba(30,41,59,0.15)",
          animation: "fadeInUp 0.4s ease",
        }}>もう一局</button>
      )}

      {/* Total games */}
      {totalGames > 0 && (
        <div style={{
          marginTop: "14px", fontSize: "0.7rem", color: "#cbd5e1",
          fontWeight: 600,
        }}>
          全 {totalGames} 局
        </div>
      )}

      <style>{`
        @keyframes drawLine {
          to { stroke-dashoffset: 0; }
        }
        @keyframes drawCircle {
          to { stroke-dashoffset: 0; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      `}</style>
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(TicTacToe));
  </script>
</body>
</html>
